<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jéricho Optique</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#26282B;
  --indigo:#3A3D40;
  --indigo-soft:#4B4E51;
  --sand:#EEECE6;
  --sand-light:#FAFAF8;
  --gold:#E8A93B;
  --gold-soft:#F4C877;
  --clay:#4A87AC;
  --green:#4F7942;
  --red:#A6402E;
  --line: rgba(38,40,43,0.12);
  --line-light: rgba(250,250,248,0.22);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans', sans-serif;
  background:var(--sand-light);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces', serif;
  margin:0;
  font-weight:600;
  letter-spacing:-0.01em;
}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}

/* ---- App shell ---- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--ink);
  color:var(--sand);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 28px;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(241,234,217,0.1);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-logo{height:32px;width:auto;display:block;}
.brand-loc{font-size:11px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:0.08em;padding-left:12px;border-left:1px solid rgba(250,250,248,0.22);}
.hero-logo{height:56px;width:auto;display:block;margin-bottom:26px;}

.topnav{display:flex;gap:4px;}
.topnav button{
  background:none;border:none;color:var(--sand);
  padding:9px 16px;border-radius:7px;font-size:14.5px;font-weight:500;
  opacity:0.72;transition:opacity .15s, background .15s;
}
.topnav button:hover{opacity:1;}
.topnav button.active{opacity:1;background:rgba(241,234,217,0.1);}

/* ---- Public site ---- */
.public-wrap{flex:1;}
.hero{
  background:linear-gradient(150deg, var(--indigo) 0%, var(--ink) 78%);
  color:var(--sand);
  padding:88px 28px 96px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;right:-90px;top:-90px;width:420px;height:420px;
  border-radius:50%;border:1.5px solid rgba(201,138,59,0.25);
}
.hero::before{

}
.hero-inner{max-width:760px;position:relative;z-index:2;}
.eyebrow{color:var(--gold-soft);font-size:13.5px;font-weight:500;margin-bottom:18px;letter-spacing:0.02em;}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.08;color:var(--sand-light);max-width:14ch;}
.hero p.lead{margin-top:22px;font-size:17px;line-height:1.6;color:rgba(241,234,217,0.82);max-width:52ch;}
.hero-cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:8px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;text-decoration:none;transition:transform .12s, background .15s;
}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{background:var(--gold-soft);}
.btn-outline{border-color:rgba(241,234,217,0.4);color:var(--sand);}

section.pub{padding:76px 28px;max-width:1080px;margin:0 auto;}
section.pub .head{max-width:560px;margin-bottom:44px;}

section.pub h2{font-size:30px;color:var(--ink);}
section.pub .head p{margin-top:12px;color:#4A4A45;font-size:15.5px;line-height:1.6;}

.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.service-card{background:var(--sand-light);padding:26px 22px;}
.service-card .num{font-family:'Fraunces',serif;font-size:13px;color:var(--gold);border:1px solid var(--gold);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.service-card h4{font-size:16.5px;margin-bottom:8px;}
.service-card p{font-size:13.8px;color:#5c5c56;line-height:1.55;}

.shops{background:var(--indigo);padding:76px 28px;}
.shops-inner{max-width:1080px;margin:0 auto;}
.shops .head .eyebrow{color:var(--gold-soft);}
.shops h2{color:var(--sand-light);}

.shop-card{

.shop-card h3{font-size:20px;color:var(--sand-light);}
.shop-card .tag{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--gold-soft);border:1px solid rgba(201,138,59,0.4);padding:3px 9px;border-radius:20px;}

.shop-card dl a:hover{border-color:var(--gold-soft);color:var(--gold-soft);}

.partners-block{padding:40px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.partners-block .partners-group + .partners-group{margin-top:26px;}
.partners-label{font-size:11.5px;font-weight:700;color:#8a8980;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;}
.partners-logos{display:flex;flex-wrap:wrap;gap:14px;}

.contact-strip{padding:70px 28px;max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);}

.contact-links{display:flex;gap:12px;flex-wrap:wrap;}
.contact-links a{border:1px solid var(--line);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--sand-light);}

footer.pub-footer{padding:22px 28px;text-align:center;font-size:12.5px;color:#8a8a83;border-top:1px solid var(--line);}
footer.pub-footer button{background:none;border:none;color:#8a8a83;text-decoration:underline;font-size:12.5px;padding:0;}

/* ---- Team space ---- */
.team-wrap{flex:1;display:flex;background:var(--sand-light);}
.gate{
  flex:1;display:flex;align-items:center;justify-content:center;padding:40px;

.gate-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:38px 34px;max-width:380px;width:100%;box-shadow:0 1px 2px rgba(16,25,46,0.04);}
.gate-card .eyebrow{color:var(--clay);font-size:12.5px;font-weight:600;margin-bottom:10px;}
.gate-card h2{font-size:22px;margin-bottom:8px;}
.gate-card p{font-size:13.8px;color:#5c5c56;line-height:1.55;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:#514f48;margin-bottom:6px;}
.field input, .field select, .field textarea{

.team-shell{flex:1;display:flex;}
.sidebar{
  width:216px;background:var(--ink);color:var(--sand);padding:22px 14px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;
}
.sidebar .who{padding:8px 10px 18px;border-bottom:1px solid rgba(241,234,217,0.12);margin-bottom:14px;}
.sidebar .who .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-soft);}
.sidebar .who .name{font-size:15px;font-weight:600;margin-top:2px;}
.sidebar .who .role-badge{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(241,234,217,0.1);color:rgba(241,234,217,0.7);}
.sidebar .who .role-badge.is-admin{background:rgba(232,169,59,0.18);color:var(--gold-soft);}
.sidebar button{

.main{flex:1;padding:30px 36px;overflow-x:auto;}
.main-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.main-head h2{font-size:24px;}
.main-head p{font-size:13.5px;color:#6b6a63;margin-top:4px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
.kpi .lbl{font-size:12px;color:#7a7970;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.kpi .val{font-family:'Fraunces',serif;font-size:30px;margin-top:6px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px;}
.panel h3{font-size:16px;margin-bottom:16px;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.toolbar input[type=text], .toolbar select{

}
.toolbar .spacer{flex:1;}
.btn-sm{padding:9px 16px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;background:var(--ink);color:var(--sand);}
.btn-sm:hover{background:var(--indigo-soft);}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--clay);}

table{width:100%;border-collapse:collapse;font-size:13.7px;}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;color:#8a8980;

}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr:hover{background:var(--sand-light);}
.empty-row td{color:#9a998f;text-align:center;padding:34px;font-style:italic;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.b-new{background:#E6ECFB;color:#2B4A9E;}
.b-contact{background:#FCEFD9;color:#8C5A0F;}
.b-rdv{background:#EADCFB;color:#6A2E9E;}
.b-won{background:#DCF2E1;color:#276B3F;}
.b-lost{background:#F5DCDC;color:#9E3A2E;}
.b-open{background:#FCEFD9;color:#8C5A0F;}
.b-progress{background:#E6ECFB;color:#2B4A9E;}
.b-wait{background:#F5E9DC;color:#8C5A3C;}
.b-done{background:#DCF2E1;color:#276B3F;}
.b-lowstock{background:#F5DCDC;color:#9E3A2E;}
.b-okstock{background:#DCF2E1;color:#276B3F;}

.row-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;color:#514f48;}
.icon-btn:hover{border-color:var(--clay);color:var(--clay);}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(16,25,46,0.5);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{background:#fff;border-radius:14px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;padding:28px 30px;}
.modal h3{font-size:19px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.form-section-title{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--clay);text-transform:uppercase;letter-spacing:0.04em;margin:4px 0 -4px;padding-top:14px;border-top:1px solid var(--line);}
.form-grid > .form-section-title:first-child{border-top:none;padding-top:0;margin-top:0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.client-detail{display:grid;grid-template-columns:1fr;gap:10px;}
.history-item{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px;display:flex;justify-content:space-between;}
.history-item .d{color:#8a8980;font-size:12px;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--sand);
  padding:12px 18px;border-radius:9px;font-size:13.5px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.2);
  opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

@media (max-width:820px){
  .team-shell{flex-direction:column;}

  .sidebar .who{display:none;}
  .sidebar .out{margin-top:0;padding-top:0;border:none;}
  .form-grid{grid-template-columns:1fr;}
  .main{padding:20px 16px;}
}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DONNEES / API GOOGLE SHEETS
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxVwZ7D_0pvYcSdZiYEcna8MteG53OnyoP6x-ylMYc8f0tojGi29q9yF8TzneJ3LpWH/exec";
const API_KEY = "jericho2026"; // doit correspondre à SECRET_KEY dans le script Apps Script

const SHEET_NAMES = { prospects:'Prospects', clients:'Clients', sav:'SAV', stock:'Stock', ventes:'Ventes' };

let DB = { prospects: [], clients: [], sav: [], stock: [], ventes: [] };
let loaded = false;

function normalizeRow(row){
  const out = {...row};
  Object.keys(out).forEach(key=>{
    if(key==='id') out[key] = String(out[key]);
    else if(/date/i.test(key) && typeof out[key]==='string' && /^\d{4}-\d{2}-\d{2}T/.test(out[key])){
      out[key] = out[key].slice(0,10);
    }
  });
  if(out.historiqueJSON !== undefined){
    try{ out.historique = out.historiqueJSON ? JSON.parse(out.historiqueJSON) : []; }catch(e){ out.historique = []; }
  }
  return out;
}

async function apiGet(k){
  const url = `${API_URL}?key=${encodeURIComponent(API_KEY)}&sheet=${encodeURIComponent(SHEET_NAMES[k])}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return (data.rows||[]).map(normalizeRow);
}

async function apiUpsert(k, row){
  const payload = {...row};
  if(k==='clients'){
    payload.historiqueJSON = JSON.stringify(payload.historique||[]);
    delete payload.historique;
  }
  // content-type text/plain évite le préflight CORS que Apps Script ne gère pas
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:API_KEY, sheet:SHEET_NAMES[k], action:'upsert', row:payload})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
}

async function apiDelete(k, id){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:API_KEY, sheet:SHEET_NAMES[k], action:'delete', row:{id}})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
}

async function loadAll(){
  for(const k of Object.keys(SHEET_NAMES)){
    try{
      DB[k] = await apiGet(k);
    }catch(e){
      DB[k] = [];
      showToast("Impossible de charger " + SHEET_NAMES[k] + ".");
    }
  }
  loaded = true;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtFCFA(n){
  n = Number(n)||0;
  return n.toLocaleString('fr-FR').replace(/,/g,' ') + ' FCFA';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   ETAT GLOBAL UI
   ========================================================= */
const ADMIN_PIN = "2026"; // code d'accès Directrice — à changer ici si besoin

const state = {
  view: 'accueil',        // 'accueil' | 'equipe'
  commercial: sessionStorageSafe('jo_commercial') || '',
  role: sessionStorageSafe('jo_role') || '',   // 'admin' | 'commercial'
  teamTab: 'prospects',   // dashboard | prospects | clients | ventes | stock
  filters: { prospects:{statut:'', boutique:'', q:''}, clients:{boutique:'', q:''}, sav:{statut:'', boutique:'', q:''}, stock:{boutique:'', categorie:'', q:''}, ventes:{boutique:'', typeArticle:'', q:''} },
  modal: null,            // {type, data}
};

function sessionStorageSafe(k){
  try{ return window.__mem ? window.__mem[k] : null; }catch(e){ return null; }
}
window.__mem = {};
function setCommercial(name, role){
  state.commercial = name;
  state.role = role;
  state.teamTab = role==='admin' ? 'dashboard' : 'prospects';
  window.__mem['jo_commercial'] = name;
  window.__mem['jo_role'] = role;
}
function isAdmin(){ return state.role==='admin'; }

const BOUTIQUES = ["Patte d'Oie","Tanghin"];
const SOURCES = ["Passage en boutique","Page Facebook","Recommandation","Appel téléphonique","Autre"];
const STATUTS_PROSPECT = ["Nouveau","Contacté","Rendez-vous pris","Converti en client","Perdu"];
const TYPES_SAV = ["Réparation","Garantie","Réclamation","Ajustement / réglage","Autre"];
const STATUTS_SAV = ["Ouvert","En cours","En attente de pièce","Résolu"];
const CATEGORIES_STOCK = ["Monture optique","Monture solaire","Verres correcteurs","Lentilles de contact","Accessoires","Autre"];

const TYPES_ARTICLE = ["Monture / Verres correcteurs","Lentilles","Accessoires","Réparation et entretien"];
const ASSURANCES = ["UAB Assurance","Ascoma","Raynal Assurance","CARFO","CNSS","Sunu Assurance","Pas d'assurance","SONABEL","ONEA","SONAR","MCI","Vitalis","Autre"];
const STAFF = ["Paloma","Alima","Ali","Amandine","Amande","Rabi","Autre"];

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    ${state.view==='accueil' ? renderPublic() : renderTeam()}
  `;
  attachGlobalEvents();
  if(state.modal) renderModal();
}

function renderMiniTable(rows, headers, mapRow){
  if(!rows.length) return `<p style="color:#9a998f;font-size:13.5px;font-style:italic;">Rien à afficher pour l'instant.</p>`;
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${mapRow(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function statutBadge(statut, kind){
  const map = {
    prospect: {'Nouveau':'b-new','Contacté':'b-contact','Rendez-vous pris':'b-rdv','Converti en client':'b-won','Perdu':'b-lost'},
    sav: {'Ouvert':'b-open','En cours':'b-progress','En attente de pièce':'b-wait','Résolu':'b-done'}
  };
  const cls = (map[kind]||{})[statut] || 'b-new';
  return `<span class="badge ${cls}">${escapeHtml(statut)}</span>`;
}

/* ---------------------------------------------------------
   VENTES  (dossier de vente complet — remplace BASE JERICHO)
   --------------------------------------------------------- */
function venteTotal(v){
  if(v.typeArticle==='Réparation et entretien') return Number(v.cout)||0;
  if(v.typeArticle==='Accessoires') return (Number(v.prixVenteMontureAcc)||0) - (Number(v.remiseAcc)||0) + (Number(v.montantAchatSpray)||0) + (Number(v.montantVenteEtui)||0) + (Number(v.montantVenteEssuieVerre)||0);
  return (Number(v.prixVenteTotalSansRemise)||0) - (Number(v.remise)||0);
}
function venteReste(v){
  return Math.max(venteTotal(v) - (Number(v.avance)||0), 0);
}

function renderVentes(){
  const f = state.filters.ventes;
  let rows = DB.ventes.filter(v=>{
    if(f.boutique && v.businessUnit!==f.boutique) return false;
    if(f.typeArticle && v.typeArticle!==f.typeArticle) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${v.nom} ${v.prenom||''} ${v.telephone||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>(b.dateMiseEnRelation||'').localeCompare(a.dateMiseEnRelation||''));

  const caTotal = rows.reduce((a,v)=>a+venteTotal(v),0);
  const resteTotal = rows.reduce((a,v)=>a+venteReste(v),0);

  return `
  <div class="main-head">
    <div><h2>Ventes</h2><p>Dossier de vente complet : article, assurance, prescription, tarification et RDV.</p></div>
    <button class="btn-sm" id="btn-new-vente">+ Nouvelle vente</button>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="lbl">Ventes (filtre actif)</div><div class="val">${rows.length}</div></div>

    <div class="kpi ${resteTotal>0?'warn':''}"><div class="lbl">Reste à payer (total)</div><div class="val" style="font-size:22px;">${fmtFCFA(resteTotal)}</div></div>
  </div>

/* ---------------------------------------------------------
   STOCK
   --------------------------------------------------------- */
function renderStock(){
  const f = state.filters.stock;
  let rows = DB.stock.filter(s=>{
    if(f.boutique && s.boutique!==f.boutique) return false;
    if(f.categorie && s.categorie!==f.categorie) return false;
    if(f.q && !(s.designation.toLowerCase().includes(f.q.toLowerCase()) || (s.reference||'').toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>a.designation.localeCompare(b.designation));

  const valeurTotale = rows.reduce((a,x)=>a+(Number(x.quantite)||0)*(Number(x.prixUnitaire)||0),0);

  return `
  <div class="main-head">
    <div><h2>Stock</h2><p>Inventaire par boutique, Patte d'Oie et Tanghin.</p></div>
    <button class="btn-sm" id="btn-new-stock">+ Nouvel article</button>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="lbl">Articles (filtre actif)</div><div class="val">${rows.length}</div></div>
    <div class="kpi"><div class="lbl">Valeur du stock affiché</div><div class="val" style="font-size:22px;">${fmtFCFA(valeurTotale)}</div></div>
    <div class="kpi ${rows.some(x=>Number(x.quantite)<=Number(x.seuilAlerte||0))?'warn':''}"><div class="lbl">Sous le seuil d'alerte</div><div class="val">${rows.filter(x=>Number(x.quantite)<=Number(x.seuilAlerte||0)).length}</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="f-stock-q" placeholder="Rechercher référence ou nom..." value="${escapeHtml(f.q)}">
    <select id="f-stock-boutique">
      <option value="">Toutes les boutiques</option>
      ${BOUTIQUES.map(b=>`<option ${f.boutique===b?'selected':''}>${b}</option>`).join('')}
    </select>
    <select id="f-stock-categorie">
      <option value="">Toutes les catégories</option>
      ${CATEGORIES_STOCK.map(c=>`<option ${f.categorie===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <button class="btn-sm btn-ghost" id="btn-export-stock">Exporter en CSV</button>
  </div>

  <div class="panel" style="padding:0;">
    <table>
      <thead><tr><th>Référence</th><th>Article</th><th>Catégorie</th><th>Boutique</th><th>Qté</th><th>Prix unit.</th><th>État</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(s=>{
          const bas = Number(s.quantite) <= Number(s.seuilAlerte||0);
          return `
          <tr>
            <td>${escapeHtml(s.reference||'—')}</td>
            <td><b>${escapeHtml(s.designation)}</b></td>
            <td>${escapeHtml(s.categorie)}</td>
            <td>${escapeHtml(s.boutique)}</td>
            <td>${s.quantite}</td>
            <td>${fmtFCFA(s.prixUnitaire)}</td>
            <td><span class="badge ${bas?'b-lowstock':'b-okstock'}">${bas?'Stock bas':'OK'}</span></td>
            <td><div class="row-actions">
              <button class="icon-btn" data-edit-stock="${s.id}">Modifier</button>
              ${isAdmin() ? `<button class="icon-btn danger" data-del-stock="${s.id}">Suppr.</button>` : ''}
            </div></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="8">Aucun article pour ces filtres.</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

/* =========================================================
   MODALES (formulaires)
   ========================================================= */
function renderModal(){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.id = 'modal-backdrop';
  back.innerHTML = `<div class="modal">${modalContent()}</div>`;
  document.getElementById('app').appendChild(back);
  back.addEventListener('click', (e)=>{ if(e.target.id==='modal-backdrop'){ state.modal=null; render(); } });
  attachModalEvents();
  if(state.modal && state.modal.type==='vente') attachVenteConditionalLogic();
}

function modalContent(){
  const m = state.modal;
  if(m.type==='prospect') return prospectForm(m.data);
  if(m.type==='client') return clientForm(m.data);
  if(m.type==='client-view') return clientView(m.data);
  if(m.type==='sav') return savForm(m.data);
  if(m.type==='stock') return stockForm(m.data);
  if(m.type==='vente') return venteForm(m.data);
  return '';
}

          <div class="field"><label>Bon non encaissé <span style="font-weight:400;color:#9a998f;">(si assurance)</span></label><input type="number" min="0" id="v-bon" value="${escapeAttr(d.montantBonNonEncaisse)}"></div>

      <div class="form-section-title">Suivi</div>
      <div class="field"><label>Date de RDV</label><input type="date" id="v-rdv" value="${escapeAttr(d.dateRdv)}"></div>
      <div class="field"><label>Commercial</label><input id="v-commercial" value="${escapeAttr(d.commercial||state.commercial)}"></div>
      <div class="field full"><label>Commentaire</label><textarea id="v-commentaire">${escapeHtml(d.commentaire)}</textarea></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-sm btn-ghost" id="modal-cancel">Annuler</button>
      <button type="submit" class="btn-sm">${data?'Enregistrer':'Ajouter la vente'}</button>
    </div>
    <input type="hidden" id="v-id" value="${escapeAttr(d.id)}">
  </form>`;
}

function bindClick(id, fn){ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); }
function bindFilter(id, setter, evt){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener(evt, ()=>{ setter(el.value); render(); document.getElementById(id).focus(); });
}

function attachVenteConditionalLogic(){
  const type = document.getElementById('v-article');
  if(!type) return;
  const toggleSections = ()=>{
    const t = type.value;
    const show = (id, cond) => { const el = document.getElementById(id); if(el) el.style.display = cond ? '' : 'none'; };
    show('sec-reparation', t==='Réparation et entretien');
    show('sec-assurance', t==='Monture / Verres correcteurs' || t==='Lentilles');
    show('sec-staff', t!=='Réparation et entretien');
    show('sec-prescription', t==='Monture / Verres correcteurs');
    show('sec-accessoires-cost', t==='Accessoires');
    show('sec-pricing-global', t==='Monture / Verres correcteurs' || t==='Lentilles');
  };
  type.addEventListener('change', toggleSections);
  toggleSections();

  const bindAutre = (selectId, wrapId) => {
    const sel = document.getElementById(selectId);
    const wrap = document.getElementById(wrapId);
    if(!sel || !wrap) return;
    const update = ()=>{ wrap.style.display = sel.value==='Autre' ? '' : 'none'; };
    sel.addEventListener('change', update);
    update();
  };
  bindAutre('v-assurance','wrap-assurance-autre');
  bindAutre('v-apporteur','wrap-apporteur-autre');
  bindAutre('v-gestionnaire','wrap-gestionnaire-autre');
  bindAutre('v-labo','wrap-labo-autre');
}

      await apiUpsert('clients', obj);

    }catch(err){ showToast("Erreur d'enregistrement, réessaie."); }

    try{
      await apiUpsert('stock', obj);
      state.modal=null; render();
      showToast(idx>=0 ? 'Article mis à jour.' : 'Article ajouté au stock.');
    }catch(err){ showToast("Erreur d'enregistrement, réessaie."); }
  });

  const fv = document.getElementById('form-vente');
  if(fv) fv.addEventListener('submit', async (e)=>{

    const existing = DB.ventes.find(v=>v.id===id);
    const val = (elId)=> (document.getElementById(elId)||{}).value || '';

      dateMiseEnRelation: val('v-date') || todayISO(),
      businessUnit: val('v-bu'),

      laboratoire: val('v-labo'), laboratoireAutre: val('v-labo-autre').trim(),
      caracteristiqueVerre: val('v-carac-verre').trim(),
      montantAchatSpray: val('v-spray'), montantVenteEtui: val('v-etui'), montantVenteEssuieVerre: val('v-essuie'),
      prixVenteMontureAcc: val('v-monture-acc'), remiseAcc: val('v-remise-acc'),
      prixVenteMonture: val('v-prix-monture'), prixVenteLentilles: val('v-prix-lentilles'),
      prixVenteLentilles2e: val('v-prix-lentilles-2e'), prixVenteMonture2e: val('v-prix-monture-2e'),
      prixVenteTotalSansRemise: val('v-prix-total'), remise: val('v-remise'),

      dateRdv: val('v-rdv'), commentaire: val('v-commentaire').trim(),
      commercial: val('v-commercial').trim() || state.commercial,
      dateCreation: (existing && existing.dateCreation) || todayISO()
    };
    const idx = DB.ventes.findIndex(v=>v.id===id);
    if(idx>=0) DB.ventes[idx]=obj; else DB.ventes.unshift(obj);

    try{
      await apiUpsert('ventes', obj);

      let client = null;
      if(obj.telephone) client = DB.clients.find(c=>c.telephone && c.telephone===obj.telephone);
      if(!client) client = DB.clients.find(c=>c.nom.toLowerCase()===obj.nom.toLowerCase() && (c.prenom||'').toLowerCase()===(obj.prenom||'').toLowerCase());

      await apiUpsert('clients', client);

      state.modal=null; render();
      showToast(idx>=0 ? 'Vente mise à jour.' : 'Vente enregistrée et fiche client synchronisée.');
    }catch(err){ showToast("Erreur d'enregistrement, réessaie."); }
  });

/* =========================================================
   UTILITAIRES
   ========================================================= */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function exportCSV(rows, fields, filename){
  if(!rows.length){ showToast('Rien à exporter.'); return; }
  const header = fields.join(';');
  const lines = rows.map(r=>fields.map(f=>`"${String(r[f]!==undefined?r[f]:'').replace(/"/g,'""')}"`).join(';'));
  const csv = [header, ...lines].join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Export CSV téléchargé.');
}
